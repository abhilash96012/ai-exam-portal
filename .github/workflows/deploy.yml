name: CI/CD & GitHub Deployment Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions: write-all

jobs:
  # ===============================================
  # Job 1: Build & Lint Test
  # ===============================================
  build-and-test:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Spring Boot Backend
        run: |
          cd backend
          mvn test-compile

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

  # ===============================================
  # Job 2: Build & Push Docker Images to GHCR
  # ===============================================
  docker-publish:
    name: Build & Publish Docker Images to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names
        id: flags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/ai-exam-frontend" >> $GITHUB_OUTPUT
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/ai-exam-backend" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.flags.outputs.BACKEND_IMAGE }}:latest
            ${{ steps.flags.outputs.BACKEND_IMAGE }}:${{ github.sha }}

      # Build & Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.flags.outputs.FRONTEND_IMAGE }}:latest
            ${{ steps.flags.outputs.FRONTEND_IMAGE }}:${{ github.sha }}
