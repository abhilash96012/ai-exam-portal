name: CI/CD & GitHub Deployment Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend

permissions:
  contents: read
  packages: write

jobs:
  # ===============================================
  # Job 1: Build & Lint Test
  # ===============================================
  build-and-test:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # ===============================================
  # Job 2: Build & Push Docker Images to GHCR
  # ===============================================
  docker-publish:
    name: Build & Publish Docker Images to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/ai-exam-backend:latest
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/ai-exam-backend:${{ github.sha }}

      # Build & Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/ai-exam-frontend:latest
            ${{ steps.repo.outputs.IMAGE_PREFIX }}/ai-exam-frontend:${{ github.sha }}

