services:
  # ===============================================
  # 1. PostgreSQL Database Service
  # ===============================================
  db:
    image: postgres:15-alpine
    container_name: exam_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-exam_automation}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-exam_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================================
  # 2. Ollama AI Engine Service
  # ===============================================
  ollama:
    image: ollama/ollama:latest
    container_name: exam_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment below to enable GPU acceleration on NVIDIA systems:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ===============================================
  # 3. Ollama Model Auto-Puller Init Service
  # ===============================================
  ollama-init:
    image: curlimages/curl:latest
    container_name: exam_ollama_init
    restart: "no"
    depends_on:
      - ollama
    volumes:
      - ./docker/pull-model.sh:/pull-model.sh
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
    entrypoint: ["/bin/sh", "/pull-model.sh"]

  # ===============================================
  # 4. Backend Express API Service
  # ===============================================
  backend:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: exam_backend
    restart: always
    environment:
      PORT: 5000
      OLLAMA_API_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "5000:5000"
    depends_on:
      - ollama
    volumes:
      - backend_uploads:/app/uploads

  # ===============================================
  # 5. Frontend React SPA Service (Nginx)
  # ===============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: exam_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
  backend_uploads:

networks:
  default:
    name: exam_network
